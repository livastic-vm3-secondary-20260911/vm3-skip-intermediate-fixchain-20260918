name: CI
on:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: vm3-skip-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Deterministic regression oracle
        shell: bash
        run: |
          echo "VM3_HEAD=${{ github.event.pull_request.head.sha }}"
          echo "VM3_BASE=${{ github.base_ref }}"
          if [ -f bug.txt ] && [ ! -f fix.txt ]; then
            echo 'VM3_DETERMINISTIC_REGRESSION=FAIL'
            exit 1
          fi
          echo 'VM3_DETERMINISTIC_REGRESSION=PASS'
